<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FinanceControl</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
  <main class="auth-card">
    <h1>FinanceControl</h1>
    <p class="sub">Gestão financeira empresarial</p>
    <div id="aviso" role="status"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <div id="erro" class="alert" role="alert" hidden></div>
      <button class="btn" type="submit" id="entrar">Entrar</button>
    </form>
    <p class="alt">Não tem conta? <a href="/register.html">Criar conta</a></p>
  </main>
  <script src="/shared/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
